
name: eTresorerie Executive - APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dependances
        run: npm install

      - name: Construire l'interface
        run: npm run build

      - name: Ajouter Android si necessaire
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: eTresorerie-Executive-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
